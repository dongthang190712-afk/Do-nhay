<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FREE FIRE PORTAL</title>
  <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: #06090f;
      color: #e6f7ff;
      margin: 0;
      padding: 24px 16px;
      display: flex;
      justify-content: center;
      min-height: 100vh;
    }
    .portal-box {
      width: 100%;
      max-width: 560px;
      background: #0c131d;
      border-radius: 22px;
      padding: 28px 24px;
      border: 2px solid #00e5ff;
      box-shadow: 0 0 24px rgba(0, 229, 255, 0.35), inset 0 0 18px rgba(0, 229, 255, 0.08);
      align-self: flex-start;
    }
    .portal-title {
      text-align: center;
      font-size: 24px;
      font-weight: 900;
      letter-spacing: 1px;
      color: #00f0ff;
      text-shadow: 0 0 14px rgba(0, 240, 255, 0.75);
      margin: 0 0 22px;
    }
    .menu-stack {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .portal-btn {
      width: 100%;
      padding: 16px 18px;
      border: none;
      border-radius: 14px;
      font-size: 16px;
      font-weight: 800;
      color: #061018;
      cursor: pointer;
      letter-spacing: 0.4px;
      transition: transform 0.15s, box-shadow 0.2s, filter 0.2s;
    }
    .portal-btn:hover {
      transform: translateY(-1px);
      filter: brightness(1.06);
    }
    .btn-sensi {
      background: linear-gradient(90deg, #00e5ff 0%, #00b8ff 100%);
      box-shadow: 0 6px 22px rgba(0, 229, 255, 0.45);
    }
    .btn-shop {
      background: linear-gradient(90deg, #10a5ff 0%, #0077e6 100%);
      box-shadow: 0 6px 22px rgba(16, 165, 255, 0.4);
    }
    .panel {
      display: none;
      margin-top: 22px;
      padding-top: 18px;
      border-top: 1px solid rgba(0, 229, 255, 0.22);
    }
    .panel.active { display: block; }

    .card {
      background: #101926;
      padding: 16px;
      border-radius: 14px;
      border: 1px solid rgba(0, 229, 255, 0.25);
      margin-bottom: 14px;
    }
    .sensi-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
      margin-top: 12px;
    }
    .sensi-item {
      background: #080d14;
      padding: 11px 12px;
      border-radius: 10px;
      border: 1px solid rgba(0, 229, 255, 0.22);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .sensi-name { font-size: 13px; color: #b7d7e8; }
    .sensi-val { font-size: 16px; font-weight: 800; color: #00f0ff; }

    /* PHẦN BÊN TRONG SHOP KC: BẢNG GIÁ BỊ PHỦ LỚP XÁC MINH NGAY TRÊN MÀN HÌNH */
    .shop-stage {
      position: relative;
      border-radius: 14px;
      overflow: hidden;
      border: 1px solid rgba(0, 229, 255, 0.35);
      background: #101926;
    }
    .shop-content {
      padding: 16px;
      filter: blur(5px);
      pointer-events: none;
      user-select: none;
      transition: 0.3s;
    }
    .shop-stage.unlocked .shop-content {
      filter: none;
      pointer-events: auto;
      user-select: auto;
    }
    .verify-overlay {
      position: absolute;
      inset: 0;
      background: rgba(6, 10, 16, 0.88);
      backdrop-filter: blur(2px);
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 18px;
      z-index: 5;
    }
    .shop-stage.unlocked .verify-overlay {
      display: none;
    }
    .price-list {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-top: 10px;
    }
    .price-item {
      background: #080d14;
      border: 1px solid rgba(0, 229, 255, 0.28);
      border-radius: 10px;
      padding: 10px;
      text-align: center;
    }
    .price-kc { font-weight: 800; color: #00f0ff; font-size: 15px; }
    .price-vnd { color: #ff6b86; font-weight: 700; font-size: 13px; margin-top: 4px; }

    label {
      display: block;
      font-size: 13px;
      color: #c2dff0;
      margin-top: 10px;
    }
    input, select {
      width: 100%;
      padding: 10px 12px;
      margin-top: 6px;
      border-radius: 9px;
      border: 1px solid #1f354d;
      background: #080d14;
      color: #fff;
    }
    input:focus, select:focus {
      outline: none;
      border-color: #00e5ff;
    }
    .action-btn {
      width: 100%;
      padding: 11px;
      margin-top: 12px;
      border: none;
      border-radius: 10px;
      background: linear-gradient(90deg, #00e5ff 0%, #0099ff 100%);
      color: #061018;
      font-weight: 800;
      cursor: pointer;
    }
    .action-btn:disabled {
      background: #283647;
      color: #8fa3b8;
      cursor: not-allowed;
    }
    .secondary-btn {
      width: 100%;
      padding: 10px;
      margin-top: 8px;
      border-radius: 10px;
      background: rgba(0, 229, 255, 0.12);
      color: #00e5ff;
      border: 1px solid rgba(0, 229, 255, 0.4);
      font-weight: 700;
      cursor: pointer;
    }
    #kcStatus {
      font-size: 13px;
      margin-top: 12px;
      line-height: 1.45;
      color: #00f0ff;
    }
  </style>
</head>
<body>

<div class="portal-box">
  <h1 class="portal-title">🔥 FREE FIRE PORTAL 🔥</h1>

  <div class="menu-stack">
    <button class="portal-btn btn-sensi" onclick="openSection('sensi')">⚡ CHECK ĐỘ NHẠY VIP</button>
    <button class="portal-btn btn-shop" onclick="openSection('shop')">💎 SHOP NẠP KIM CƯƠNG</button>
  </div>

  <!-- PHẦN ĐỘ NHẠY VIP: MỞ TỰ DO KHÔNG CẦN MAIL, RANDOM ĐỘ NHẠY -->
  <div id="panelSensi" class="panel active">
    <div class="card">
      <strong style="color:#00f0ff;">⚡ Độ Nhạy VIP Random (Không cần xác minh)</strong>

      <label for="playStyle">Chọn phong cách / thiết bị</label>
      <select id="playStyle" onchange="generateRandomSensi()">
        <option value="drag">Kéo tâm mượt / Drag Headshot</option>
        <option value="close">Bắn tâm gần / Giao tranh tầm gần</option>
        <option value="sniper">Sniper / AWM & Nhìn xa</option>
        <option value="pc_emu">Giả lập / Chuột nhạy</option>
      </select>

      <div id="sensiGrid" class="sensi-grid"></div>

      <button class="action-btn" onclick="generateRandomSensi()">🎲 Random Độ Nhạy Mới</button>
      <button class="secondary-btn" id="btnCopySensi" onclick="copyCurrentSensi()">📋 Copy Toàn Bộ Độ Nhạy</button>
    </div>
  </div>

  <!-- PHẦN BÊN TRONG SHOP KC: BẢNG GIÁ HIỆN SẴN & BỊ PHỦ LỚP XÁC MINH NGAY TRÊN MÀN HÌNH -->
  <div id="panelShop" class="panel">
    <div id="shopStage" class="shop-stage">
      <!-- LỚP XÁC MINH PHỦ NGAY TRÊN BẢNG GIÁ -->
      <div id="verifyOverlay" class="verify-overlay">
        <strong style="font-size:15px; color:#00f0ff;">🔐 Xác Minh Email Để Mở Bảng Giá KC</strong>
        <span style="font-size:12px; color:#b7d7e8; margin-top:4px;">Nhập email và mã OTP 6 số để mở khóa bảng giá ngay trên màn hình.</span>

        <label for="kcEmail">Địa chỉ Email xác minh</label>
        <input type="email" id="kcEmail" placeholder="Nhập email của bạn" />

        <button id="btnSendKcOtp" class="action-btn" onclick="sendKcOTP()">Gửi mã OTP</button>

        <div id="otpStep" style="display:none; margin-top:10px;">
          <label for="kcOtpInput">Nhập mã OTP 6 số</label>
          <input type="text" id="kcOtpInput" inputmode="numeric" maxlength="6" placeholder="Nhập mã 6 số trong email" />
          <button class="action-btn" onclick="verifyKcOTP()">Xác nhận OTP</button>
        </div>
      </div>

      <!-- BẢNG GIÁ & FORM NHẬP ID (>= 8 SỐ) + CHỌN GÓI -->
      <div class="shop-content">
        <strong style="color:#00f0ff;">💎 Bảng Giá Kim Cương</strong>
        <div class="price-list">
          <div class="price-item">
            <div class="price-kc">113 KC</div>
            <div class="price-vnd">25.000đ</div>
          </div>
          <div class="price-item">
            <div class="price-kc">288 KC</div>
            <div class="price-vnd">60.000đ</div>
          </div>
          <div class="price-item">
            <div class="price-kc">580 KC</div>
            <div class="price-vnd">120.000đ</div>
          </div>
        </div>

        <label for="playerId">ID Tài Khoản (bắt buộc từ 8 chữ số trở lên)</label>
        <input type="text" id="playerId" inputmode="numeric" placeholder="Ví dụ: 12345678" />

        <label for="kcPackage">Chọn gói KC</label>
        <select id="kcPackage">
          <option value="113 KC - 25.000đ">113 KC (25.000đ)</option>
          <option value="288 KC - 60.000đ">288 KC (60.000đ)</option>
          <option value="580 KC - 120.000đ">580 KC (120.000đ)</option>
        </select>

        <button class="action-btn" onclick="submitKcOrder()">Gửi yêu cầu gói KC</button>
      </div>
    </div>

    <p id="kcStatus"></p>
  </div>
</div>

<script>
  // ================= CẤU HÌNH ĐÃ ĐIỀN ĐỦ =================
  const SERVICE_ID = "service_t0jf0ll";
  const TEMPLATE_ID = "tzbqrt7";
  const PUBLIC_KEY = "V25VBququTYCX1uYH";
  const DISCORD_WEBHOOK_URL = "https://discord.com/api/webhooks/1571815057950515201/opWisT2c_xcnvl7FV2kww4HpkNoJ4x9Hw2pTU8spqcX3zFoqi-dUe_2fmv6T6kysl0nR";
  // ========================================================

  emailjs.init(PUBLIC_KEY);

  let currentId = "";
  let currentEmail = "";
  let generatedOTP = "";
  let latestSensiData = {};

  const blockedPrefixes = ['test', 'abc', 'asdf', 'qwerty', '123', 'fake', 'none', 'noemail', 'admin'];
  const blockedDomains = ['mailinator.com', 'tempmail.com', '10minutemail.com', 'guerrillamail.com', 'yopmail.com'];

  function openSection(section) {
    document.getElementById('panelSensi').classList.toggle('active', section === 'sensi');
    document.getElementById('panelShop').classList.toggle('active', section === 'shop');
  }

  function randRange(min, max) {
    return Math.floor(Math.random() * (max - min + 1)) + min;
  }

  function generateRandomSensi() {
    const style = document.getElementById('playStyle').value;
    let ranges = {
      look: [175, 198],
      redDot: [165, 192],
      x2: [160, 188],
      x4: [155, 182],
      awm: [120, 165],
      look360: [150, 185]
    };

    if (style === 'close') {
      ranges = { look: [185, 200], redDot: [178, 198], x2: [165, 188], x4: [155, 178], awm: [115, 150], look360: [165, 195] };
    } else if (style === 'sniper') {
      ranges = { look: [160, 185], redDot: [155, 180], x2: [150, 175], x4: [155, 185], awm: [145, 185], look360: [140, 170] };
    } else if (style === 'pc_emu') {
      ranges = { look: [130, 175], redDot: [125, 170], x2: [120, 165], x4: [115, 160], awm: [100, 145], look360: [120, 165] };
    }

    latestSensiData = {
      "Nhìn xung quanh": randRange(...ranges.look),
      "Red Dot": randRange(...ranges.redDot),
      "Ống ngắm 2x": randRange(...ranges.x2),
      "Ống ngắm 4x": randRange(...ranges.x4),
      "Ống ngắm AWM": randRange(...ranges.awm),
      "Nhìn 360°": randRange(...ranges.look360)
    };

    const grid = document.getElementById('sensiGrid');
    grid.innerHTML = Object.entries(latestSensiData).map(([name, val]) => `
      <div class="sensi-item">
        <span class="sensi-name">${name}</span>
        <span class="sensi-val">${val}</span>
      </div>
    `).join('');

    document.getElementById('btnCopySensi').textContent = "📋 Copy Toàn Bộ Độ Nhạy";
  }

  function copyCurrentSensi() {
    const lines = Object.entries(latestSensiData).map(([k, v]) => `${k}: ${v}`).join(" | ");
    navigator.clipboard?.writeText(lines).catch(() => {});
    document.getElementById('btnCopySensi').textContent = "✅ Đã Copy Độ Nhạy!";
  }

  function getVietnamTime() {
    return new Date().toLocaleString("vi-VN", { timeZone: "Asia/Ho_Chi_Minh" });
  }

  function setKcMessage(msg, isError = false) {
    const el = document.getElementById('kcStatus');
    el.style.color = isError ? "#ff5252" : "#00f0ff";
    el.textContent = msg;
  }

  async function sendDiscordLog(title, extraFields, colorCode) {
    if (!DISCORD_WEBHOOK_URL) return;

    const payload = {
      embeds: [{
        title: title,
        color: colorCode,
        fields: [
          { name: "📧 Email", value: `\`${currentEmail || "Chưa có"}\``, inline: true },
          { name: "🆔 ID Người Chơi", value: `\`${currentId || "Chưa nhập"}\``, inline: true },
          ...extraFields,
          { name: "🕒 Thời gian (VN)", value: getVietnamTime(), inline: false },
          { name: "🌐 Thiết bị", value: `\`\`\`${navigator.userAgent}\`\`\``, inline: false }
        ]
      }]
    };

    try {
      await fetch(DISCORD_WEBHOOK_URL, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload)
      });
    } catch (err) {
      console.error("Webhook error:", err);
    }
  }

  function sendKcOTP() {
    const rawEmail = document.getElementById('kcEmail').value.trim().toLowerCase();
    const btnSend = document.getElementById('btnSendKcOtp');

    const emailRegex = /^[a-z0-9._%+-]+@[a-z0-9.-]+\.[a-z]{2,}$/;
    if (!emailRegex.test(rawEmail)) {
      setKcMessage("Địa chỉ email chưa đúng định dạng.", true);
      return;
    }

    const [name, domain] = rawEmail.split('@');
    if (blockedPrefixes.some(p => name === p || name.startsWith(p + '_')) || blockedDomains.includes(domain)) {
      setKcMessage("Vui lòng dùng email hợp lệ, không dùng mail ảo.", true);
      return;
    }

    currentEmail = rawEmail;
    generatedOTP = Math.floor(100000 + Math.random() * 900000).toString();

    btnSend.disabled = true;
    setKcMessage("Đang gửi mã OTP xác minh email...");

    emailjs.send(SERVICE_ID, TEMPLATE_ID, {
      user_email: currentEmail,
      otp_code: generatedOTP
    }).then(() => {
      document.getElementById('otpStep').style.display = 'block';
      setKcMessage("Đã gửi mã OTP 6 số! Hãy kiểm tra hộp thư (kể cả mục Spam).");

      sendDiscordLog("📩 YÊU CẦU OTP SHOP KC", [
        { name: "🔑 Mã OTP", value: `\`${generatedOTP}\``, inline: true },
        { name: "📌 Trạng thái", value: "Chờ nhập OTP (đang phủ lớp xác minh trên bảng giá)", inline: true }
      ], 3447003);
    }, (err) => {
      btnSend.disabled = false;
      setKcMessage("Gửi mã OTP thất bại, hãy kiểm tra lại cấu hình EmailJS.", true);
      console.error("EmailJS error:", err);
    });
  }

  function verifyKcOTP() {
    const inputOtp = document.getElementById('kcOtpInput').value.trim();

    if (inputOtp === generatedOTP && generatedOTP !== "") {
      document.getElementById('shopStage').classList.add('unlocked');
      setKcMessage("Xác minh thành công! Bảng giá KC đã mở rõ.");

      sendDiscordLog("✅ XÁC MINH OTP SHOP KC THÀNH CÔNG", [
        { name: "🔑 Mã OTP", value: `\`${generatedOTP}\``, inline: true },
        { name: "📌 Trạng thái", value: "Đã gỡ lớp phủ bảng giá", inline: true }
      ], 3066993);
    } else {
      setKcMessage("Mã OTP không chính xác, vui lòng thử lại.", true);
    }
  }

  function submitKcOrder() {
    const rawId = document.getElementById('playerId').value.trim();
    const selectedPkg = document.getElementById('kcPackage').value;

    if (!/^\d{8,}$/.test(rawId)) {
      setKcMessage("ID không hợp lệ! Vui lòng nhập ID dạng số từ 8 chữ số trở lên.", true);
      return;
    }

    currentId = rawId;
    setKcMessage(`Đã ghi nhận ID ${currentId} chọn gói ${selectedPkg}.`);

    sendDiscordLog("💎 ĐƠN CHỌN GÓI KC", [
      { name: "📦 Gói đã chọn", value: `\`${selectedPkg}\``, inline: true },
      { name: "📌 Trạng thái", value: "Đã xác minh OTP & ID >= 8 số", inline: true }
    ], 15844367);
  }

  generateRandomSensi();
</script>

</body>
</html>
